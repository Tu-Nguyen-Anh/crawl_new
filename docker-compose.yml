version: '3.8'
services:
  web:
    build: .
    container_name: news_crawler
    ports:
      - "8008:8008"
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Ho_Chi_Minh
    command: python main.py
    networks:
      - english-vocabulary-network

networks:
  english-vocabulary-network:
    external: true
